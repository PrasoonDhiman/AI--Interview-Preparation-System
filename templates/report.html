<!DOCTYPE html>
<html>

<head >
<link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">

<title>AI Interview Report</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f5f5f5;
}


.container{

    background:white;
    padding:30px;
    border-radius:10px;

}


.section{

    border:1px solid #ddd;
    padding:20px;
    margin-top:20px;
    border-radius:10px;

}


button{

    margin-top:30px;
    padding:12px 25px;
    font-size:16px;
    cursor:pointer;

}


pre{

    white-space:pre-wrap;
    font-size:15px;

}

</style>


</head>


<body>


<div class="container" id="report">


<h1>
AI Interview Evaluation Report
</h1>



<div class="section">

<h2>
Technical Evaluation
</h2>


<pre>
{{ report }}
</pre>


</div>




<div class="section">


<h2>
Communication Analysis
</h2>


<pre>
{{ communication_report }}
</pre>


</div>



</div>



<button onclick="downloadPDF()">

Download PDF Report

</button>




<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
</script>



<script>


function downloadPDF(){


    const element = document.getElementById("report");


    const options = {

        margin:10,

        filename:"AI_Interview_Report.pdf",

        image:{
            type:"jpeg",
            quality:0.98
        },


        html2canvas:{
            scale:2
        },


        jsPDF:{
            unit:"mm",
            format:"a4",
            orientation:"portrait"
        }

    };



    html2pdf()

    .set(options)

    .from(element)

    .save();


}


</script>



</body>

</html>
